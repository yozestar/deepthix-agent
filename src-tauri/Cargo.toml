[package]
name = "app"
version = "0.5.8"
description = "Standalone macOS app for running and watching Claude Code agents in a pixel art office."
authors = ["Elyone"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Tauri's `cargo run` invocation needs to know which binary to launch
# now that we ship both `app` (the Tauri shell) and `deepthix-mcp`
# (the JSON-RPC sidecar claude spawns).
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Sidecar binary: a small JSON-RPC stdio MCP server that claude
# launches via --mcp-config. Exposes tools that read session state
# from ~/.deepthix/ and ~/.claude/projects/ so the orchestrator (and
# any other claude session) can introspect what its siblings are
# doing without going through HTTP / Tauri IPC.
[[bin]]
name = "deepthix-mcp"
path = "src/bin/deepthix-mcp.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Auto-updater + relaunch helpers disabled on Windows ARM64 — the
# transitive `ring` crate needs clang to build. Re-enable after
# `winget install LLVM.LLVM` (also requires `winget install Strawberry.Perl`).
# tauri-plugin-updater = "2"
# tauri-plugin-process = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "5"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
notify = "7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# In-process HTTPS (Windows: SChannel via native-tls — no `ring`, no clang).
# Replaces spawning curl, which flashed console windows and blocked the UI.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }
# Remote access (remote/): async plumbing for the loopback server.
sha2 = "0.10"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
rand = "0.8"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.10.3", features = ["test"] }
tokio-tungstenite = "0.29"
