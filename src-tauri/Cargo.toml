[package]
name = "app"
version = "0.2.1"
description = "Standalone macOS app for running and watching Claude Code agents in a pixel art office."
authors = ["Deepthix Agent contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Tauri's `cargo run` invocation needs to know which binary to launch
# now that we ship both `app` (the Tauri shell) and `deepthix-mcp`
# (the JSON-RPC sidecar claude spawns).
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Sidecar binary: a small JSON-RPC stdio MCP server that claude
# launches via --mcp-config. Exposes tools that read session state
# from ~/.deepthix/ and ~/.claude/projects/ so the orchestrator (and
# any other claude session) can introspect what its siblings are
# doing without going through HTTP / Tauri IPC.
[[bin]]
name = "deepthix-mcp"
path = "src/bin/deepthix-mcp.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "5"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
notify = "7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tempfile = "3"
