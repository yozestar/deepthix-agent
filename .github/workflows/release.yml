# Release pipeline.
#
# Trigger: push of any v* tag (e.g. v0.1.0) OR manual dispatch.
# Output: a GitHub Release named after the tag, with .dmg/.app.tar.gz
# (macOS Apple Silicon + Intel) and .msi/.exe (Windows x64) attached.
#
# Builds happen on GitHub-hosted runners — Tauri can't cross-compile to
# Windows from macOS because it needs the Windows toolchain (MSVC, WiX).
# Three matrix legs:
#   - macos-latest with `aarch64-apple-darwin`  -> Apple Silicon dmg
#   - macos-latest with `x86_64-apple-darwin`   -> Intel dmg
#   - windows-latest with default target         -> Windows MSI/NSIS
#
# Notes
#   - We use --legacy-peer-deps because @xterm/addon-web-links@0.11
#     declares a peer on @xterm/xterm@^5 but we ship v6 (the addon
#     still works fine, it's a stale peer range).
#   - The official tauri-action handles compiling, bundling, and
#     uploading every artifact to the release in one step.
#   - releaseDraft: true so the user can review + publish manually
#     once all three jobs finish — useful if one platform fails.
#   - github.ref_name is forwarded via env vars (not interpolated in
#     run: blocks) per GitHub's workflow-injection guidance.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: 'macOS (Apple Silicon)'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: 'macOS (Intel)'
          - platform: windows-latest
            args: ''
            label: 'Windows x64'

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain (with macOS targets when needed)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry + target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root deps
        # See header note re: legacy-peer-deps.
        run: npm install --legacy-peer-deps

      - name: Install webview deps
        run: npm install --prefix webview-ui --legacy-peer-deps

      # Disable updater-artifact creation when signing isn't configured
      # — otherwise the bundler aborts with "incorrect updater private
      # key password" because tauri-action passes empty env strings to
      # the bundler, which it treats as "use this empty key" instead of
      # "skip signing". Patching tauri.conf.json before build gracefully
      # ships unsigned installers when secrets aren't set on the repo.
      - name: Disable updater artifacts if signing key is missing
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set in repo secrets — building installers WITHOUT updater artifacts (auto-update from this version will be a no-op)"
            python3 -c "import json; p='src-tauri/tauri.conf.json'; c=json.load(open(p)); c['bundle']['createUpdaterArtifacts']=False; json.dump(c, open(p,'w'), indent=2)"
          else
            echo "Signing key detected — building updater artifacts (.app.tar.gz / .nsis.zip + .sig)"
          fi

      - name: Build + bundle + release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing keys. When TAURI_SIGNING_PRIVATE_KEY is
          # empty the previous step has already disabled updater artifacts
          # in tauri.conf.json, so the bundler won't try to sign anything.
          # Passing empty strings here is harmless in that case.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Deepthix Agent ${{ env.RELEASE_TAG }}
          releaseBody: |
            Auto-built by `.github/workflows/release.yml`.
            Pick the artifact matching your machine:
              - `*_aarch64.dmg`     -> macOS on Apple Silicon (M1/M2/M3/M4)
              - `*_x64.dmg`         -> macOS on Intel
              - `*_x64-setup.exe`   -> Windows installer (NSIS)
              - `*_x64_en-US.msi`   -> Windows installer (MSI)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Once every platform has uploaded its updater artifact (.app.tar.gz
  # for macOS, .nsis.zip for Windows) plus its detached .sig file,
  # synthesize a single latest.json keyed by platform target and upload
  # it as a release asset. The Tauri updater plugin fetches this JSON
  # from the endpoint configured in tauri.conf.json, picks the row
  # matching the user's platform, downloads + verifies + applies.
  #
  # Filename convention assumed:
  #   macOS arm64  → Deepthix.Agent_<v>_aarch64.app.tar.gz + .sig
  #   macOS x64    → Deepthix.Agent_<v>_x64.app.tar.gz     + .sig
  #   Windows x64  → Deepthix.Agent_<v>_x64-setup.nsis.zip + .sig
  assemble-updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (for repo metadata only)
        uses: actions/checkout@v4

      - name: Build + upload latest.json
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          REPO="${{ github.repository }}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Query the actual asset names from the release rather than
          # constructing them — tauri-action's filename convention varies
          # between bundle types (e.g. `Deepthix.Agent_aarch64.app.tar.gz`
          # has no version suffix, while `Deepthix.Agent_0.4.2_aarch64.dmg`
          # does). Constructing them by hand caused v0.4.x's latest.json
          # to point at non-existent URLs → 404 in the in-app updater.
          ASSETS_JSON="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name]')"

          find_asset() {
            local pattern="$1"
            echo "$ASSETS_JSON" | jq -r --arg p "$pattern" '.[] | select(test($p))' | head -1
          }

          # Quiet curl — no echo on failure (the previous version echoed a
          # ::warning:: into the function's stdout, which got captured as
          # the "signature" string in v0.4.x's broken latest.json).
          fetch_sig() {
            local fname="$1"
            curl -fsSL --retry 5 --retry-delay 4 "${BASE_URL}/${fname}.sig" 2>/dev/null
          }

          ARM_TGZ="$(find_asset 'aarch64.*\\.app\\.tar\\.gz$')"
          INTEL_TGZ="$(find_asset 'x64.*\\.app\\.tar\\.gz$')"
          WIN_NSIS="$(find_asset 'x64.*nsis\\.zip$')"

          echo "Detected updater artifacts:"
          echo "  arm   = ${ARM_TGZ:-<none>}"
          echo "  intel = ${INTEL_TGZ:-<none>}"
          echo "  win   = ${WIN_NSIS:-<none>}"

          ARM_SIG=""
          INTEL_SIG=""
          WIN_SIG=""
          [ -n "$ARM_TGZ" ]   && ARM_SIG="$(fetch_sig "$ARM_TGZ" || true)"
          [ -n "$INTEL_TGZ" ] && INTEL_SIG="$(fetch_sig "$INTEL_TGZ" || true)"
          [ -n "$WIN_NSIS" ]  && WIN_SIG="$(fetch_sig "$WIN_NSIS" || true)"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/${REPO}/releases/tag/${TAG}" \
            --arg pub_date "$PUB_DATE" \
            --arg arm_url "${BASE_URL}/${ARM_TGZ}" \
            --arg intel_url "${BASE_URL}/${INTEL_TGZ}" \
            --arg win_url "${BASE_URL}/${WIN_NSIS}" \
            --arg arm_sig "$ARM_SIG" \
            --arg intel_sig "$INTEL_SIG" \
            --arg win_sig "$WIN_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: (
                (if ($arm_sig | length) > 0 then {"darwin-aarch64": {signature: $arm_sig, url: $arm_url}} else {} end)
                + (if ($intel_sig | length) > 0 then {"darwin-x86_64": {signature: $intel_sig, url: $intel_url}} else {} end)
                + (if ($win_sig | length) > 0 then {"windows-x86_64": {signature: $win_sig, url: $win_url}} else {} end)
              )
            }' > latest.json

          cat latest.json

          PLATFORMS_COUNT="$(jq '.platforms | length' latest.json)"
          if [ "$PLATFORMS_COUNT" = "0" ]; then
            echo "::warning::latest.json has no platform entries — auto-update will be a no-op until TAURI_SIGNING_PRIVATE_KEY is configured + a release is built with it."
          fi

          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
